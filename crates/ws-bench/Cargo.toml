[package]
name = "ws-bench"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
description = "WebSocket throughput bench client (Rust + tokio-tungstenite). Bypasses Python asyncio.gather scheduling pathology to measure real server-side multi-connection perf."
publish = false

[[bin]]
name = "ws-bench"
path = "src/main.rs"

[dependencies]
tokio = { workspace = true }
tokio-tungstenite = { workspace = true }
futures-util = "0.3"
clap = { version = "4", features = ["derive"] }
