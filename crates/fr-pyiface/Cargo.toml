[package]
name = "fr-pyiface"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
description = "PyO3 bindings — the cdylib loaded by Python as hyperfastapi._core"

[lib]
name = "_core"
crate-type = ["cdylib"]
path = "src/lib.rs"

[dependencies]
fr-json = { path = "../fr-json" }

# extension-module: do not link libpython (we're loaded into the interpreter).
# abi3-py310: stable ABI from Python 3.10+ — single wheel works for 3.10/3.11/3.12/3.13.
pyo3 = { version = "0.22", features = ["extension-module", "abi3-py310"] }
parking_lot.workspace = true
once_cell.workspace = true

# Phase M: native JSON serialization in dispatch hot path (replaces Python
# json.dumps for the common dict/list/scalar payloads). Falls back to Python
# encoder for exotic types (Pydantic models, datetime, UUID, etc.).
serde_json = { workspace = true }
itoa = "1"
ryu = "1"

# Phase N: native HTTP server (replaces uvicorn for max-perf scenarios).
# tokio multi-thread runtime + hyper 1.x. Goal: 100k+ RPS single-process by
# avoiding the uvicorn ASGI parser/scope-build overhead and minimizing the
# Python entry footprint to just the handler call + response build.
tokio = { workspace = true }
hyper = { workspace = true }
# hyper-util's auto::Builder serves HTTP/1.1 AND HTTP/2 from a single
# connection — auto-detects the version from the client preface.
hyper-util = { workspace = true, features = ["server-auto", "tokio"] }
bytes = { workspace = true }
http-body-util = "0.1"

# Phase O: TLS for HTTPS + ALPN-negotiated HTTP/2.
# rustls = pure-Rust TLS impl, no openssl dependency on Windows/macOS.
# tokio-rustls = async wrapper. ring = TLS crypto provider.
rustls = { version = "0.23", default-features = false, features = ["std", "tls12", "ring"] }
tokio-rustls = { version = "0.26", default-features = false, features = ["tls12", "ring"] }
rustls-pemfile = "2.2"

# Phase O: HTTP/3 over QUIC (UDP). h3 is the protocol layer; h3-quinn
# bridges it to the quinn QUIC implementation. quinn requires rustls for
# TLS handshake (HTTP/3 has no plaintext mode).
quinn = { version = "0.11", default-features = false, features = ["runtime-tokio", "rustls", "ring"] }
h3 = "0.0.8"
h3-quinn = "0.0.10"
http = "1"

# WebSockets: tokio-tungstenite handles the framing once hyper hands us
# the upgraded connection. We accept the upgrade ourselves (Sec-WebSocket-
# Accept handshake) so we keep zero dependencies on Starlette's WS shim.
tokio-tungstenite = { workspace = true }
sha1 = "0.10"
base64 = "0.22"
futures-util = "0.3"
