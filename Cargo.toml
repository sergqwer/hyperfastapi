[workspace]
resolver = "2"
members = [
    "crates/fr-json",
    "crates/fr-pyiface",
    "crates/ws-bench",
]

[workspace.package]
version = "0.1.0"
edition = "2021"
rust-version = "1.80"
license = "MIT"

[workspace.dependencies]
# Core async stack
tokio = { version = "1.40", features = ["full"] }
hyper = { version = "1.4", features = ["full"] }
hyper-util = { version = "0.1", features = ["full"] }
matchit = "0.8"
bytes = "1.6"

# Serialization (preserve_order required for OpenAPI byte-exact match)
serde = { version = "1.0", features = ["derive"] }
serde_json = { version = "1.0", features = ["preserve_order"] }

# SIMD acceleration
simd-json = "0.14"
base64-simd = "0.8"
simdutf8 = "0.1"

# HTTP body parsing
multer = "3"
serde_urlencoded = "0.7"

# WebSocket (Phase G)
tokio-tungstenite = "0.23"

# Utility
smallvec = "1.13"
ahash = "0.8"
once_cell = "1.19"
parking_lot = "0.12"
thiserror = "1.0"

[profile.release]
# Maximum throughput configuration: LTO + single codegen unit + fat optimization.
# These add ~30-60s to release builds but yield 5-15% perf gain in tight loops.
opt-level = 3
lto = "fat"
codegen-units = 1
panic = "abort"
strip = "symbols"

[profile.release-debug]
# Release perf with debug info — for flamegraph profiling.
inherits = "release"
debug = true
strip = "none"

[profile.dev]
# Dev builds: skip LTO for fast iteration; basic optimization.
opt-level = 1
