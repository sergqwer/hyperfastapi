name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always
  RUST_BACKTRACE: 1
  PYO3_USE_ABI3_FORWARD_COMPATIBILITY: "1"

jobs:
  # Lint Rust + Python sources first. Cheap; fails fast on style issues so
  # we don't burn matrix minutes on a typo.
  lint:
    name: Lint (rustfmt + clippy)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
      - name: rustfmt --check
        run: cargo fmt --all -- --check
      - name: clippy
        # Allow warnings for now (Phase J/K incremental work) but fail on errors.
        run: cargo clippy --workspace --all-targets -- -A warnings

  # Build wheel + run conformance + perf-light per OS / Python combo.
  # Keeps PR feedback under ~10 minutes per matrix cell.
  conformance:
    name: ${{ matrix.os }} / Python ${{ matrix.python }}
    needs: lint
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        python: ["3.10", "3.11", "3.12", "3.13"]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      - name: Setup Python ${{ matrix.python }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2
        with:
          shared-key: ${{ matrix.os }}-${{ matrix.python }}

      - name: Install build deps
        run: |
          python -m pip install --upgrade pip
          python -m pip install maturin pytest pytest-timeout httpx pydantic "starlette>=0.40,<0.47" python-multipart anyio jinja2 psutil dirty_equals

      - name: Build wheel (release)
        run: |
          python -m maturin build --release --interpreter python

      - name: Install wheel
        # `find` works cross-platform via Python rather than bash glob, since
        # Windows runners don't ship find/glob in the same shell.
        run: |
          python -c "import glob, subprocess, sys; w = glob.glob('target/wheels/hyperfastapi-*.whl')[0]; subprocess.check_call([sys.executable, '-m', 'pip', 'install', '--force-reinstall', '--no-deps', w])"

      - name: Conformance tests
        env:
          HYPERFASTAPI_AS_FASTAPI: "1"
          PYTHONPATH: tests
        run: |
          python -m pytest tests/conformance -q --tb=short

      # perf-light: single short scenario, INFORMATIONAL ONLY. Real perf
      # gate is the nightly job below. We don't fail PR CI on perf since
      # GH-hosted runners are noisy and bombardier isn't pre-installed
      # on every OS image.
      - name: Perf smoke (get_plain, 5s)
        if: matrix.os == 'ubuntu-latest'
        continue-on-error: true
        env:
          HYPERFASTAPI_AS_FASTAPI: "1"
        run: |
          curl -sL -o /tmp/bombardier https://github.com/codesenberg/bombardier/releases/download/v1.2.6/bombardier-linux-amd64
          chmod +x /tmp/bombardier
          mkdir -p tests/perf/bin
          cp /tmp/bombardier tests/perf/bin/bombardier
          python tests/perf/runner.py --scenario get_plain --mode single --duration 5

  # Build distributable wheels for release. Matches the conformance matrix so
  # we ship every supported (OS, Python) combination.
  wheels:
    name: Build wheel ${{ matrix.os }} / py${{ matrix.python }}
    needs: conformance
    if: github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/tags/')
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        python: ["3.10"]  # abi3 wheel — single build serves 3.10..latest
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: Build wheel
        run: |
          python -m pip install --upgrade pip maturin
          python -m maturin build --release --interpreter python
      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: wheel-${{ matrix.os }}
          path: target/wheels/*.whl

